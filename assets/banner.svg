<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Muhammad Azfar, AI Engineer building agentic systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#141033"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#2DE1C2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#glow)"/>

  <!-- agent graph -->
  <g stroke="url(#edge)" stroke-width="1.6" fill="none" opacity="0.75">
    <path d="M760 140 L860 70"/>
    <path d="M760 140 L860 210"/>
    <path d="M860 70 L980 140"/>
    <path d="M860 210 L980 140"/>
    <path d="M980 140 L1100 90"/>
    <path d="M980 140 L1100 190"/>
    <path d="M1100 190 C1100 250 760 250 760 152" stroke-dasharray="5 6"/>
  </g>
  <g>
    <circle cx="760" cy="140" r="11" fill="#0A0E1A" stroke="#7C6CFF" stroke-width="2"/>
    <circle cx="860" cy="70" r="9" fill="#0A0E1A" stroke="#7C6CFF" stroke-width="2"/>
    <circle cx="860" cy="210" r="9" fill="#0A0E1A" stroke="#7C6CFF" stroke-width="2"/>
    <circle cx="980" cy="140" r="12" fill="#2DE1C2"/>
    <circle cx="1100" cy="90" r="9" fill="#0A0E1A" stroke="#2DE1C2" stroke-width="2"/>
    <circle cx="1100" cy="190" r="9" fill="#0A0E1A" stroke="#2DE1C2" stroke-width="2"/>
    <circle r="4" fill="#2DE1C2">
      <animateMotion dur="5s" repeatCount="indefinite" path="M760 140 L860 70 L980 140 L1100 190 C1100 250 760 250 760 152"/>
    </circle>
  </g>

  <text x="64" y="112" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="15" fill="#2DE1C2" letter-spacing="3">AI ENGINEER / AGENTIC SYSTEMS</text>
  <text x="64" y="170" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#F2F4FF">Muhammad Azfar</text>
  <text x="64" y="212" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#9AA3C7">Agents that reason, act, fail, and recover.</text>
</svg>
